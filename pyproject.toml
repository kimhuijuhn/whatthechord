[project]
name = "whatthechord"
version = "0.1.0"
description = "Real-time symbolic music chord recognition with music-theoretic priors"
authors = [{name = "Hugh Kim"}]
requires-python = ">=3.10"
dependencies = [
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
wip = [
    "pretty_midi>=0.2.10",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]